name: Publish MR Studio phone client
on:
  push:
    branches: [main, lindholmen, universeum]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Resolve current branch heads after taking the workflow-wide Pages lock.
      - uses: actions/checkout@v6
        with:
          ref: main
          path: .pages-main
      - uses: actions/checkout@v6
        with:
          ref: lindholmen
          path: .pages-lindholmen
      - uses: actions/checkout@v6
        with:
          ref: universeum
          path: .pages-universeum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every branch
        shell: bash
        run: |
          set -euo pipefail
          for branch in main lindholmen universeum; do
            (
              cd ".pages-$branch"
              node scripts/test_ecom_lifecycle.cjs
              node scripts/test_session.cjs
              node scripts/test_session_connection.cjs
              python scripts/test_session_server.py
              python scripts/test_pages_site.py
              node scripts/test_pages_client.cjs
              if [ "$branch" = lindholmen ]; then
                node scripts/test_lindholmen.cjs
              fi
            )
          done
      - name: Build complete Pages site
        run: >-
          python .pages-main/scripts/build_pages_site.py
          --main .pages-main --lindholmen .pages-lindholmen
          --universeum .pages-universeum --output dist/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy all phone clients
        id: deployment
        uses: actions/deploy-pages@v4
