name: Publish MR Studio phone client
on:
  push:
    branches: [main]
    paths: ['app-config.js', 'app-config-runtime.js', 'session/**', 'controller/**', 'controller.js', 'controller.html', 'style.css', 'ecom-palette.js', 'animations/coolpaths-guide.js', 'animations/cfd-core.js', 'animations/cfd-visuals.js', 'scripts/build_session_client.py', '.github/workflows/session-client-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_ecom_lifecycle.cjs
      - run: node scripts/test_session.cjs
      - run: node scripts/test_session_connection.cjs
      - run: python scripts/test_session_server.py
      - run: python scripts/build_session_client.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/session-client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy phone client
        id: deployment
        uses: actions/deploy-pages@v4
